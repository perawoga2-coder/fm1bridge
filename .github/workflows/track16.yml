name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 0.12: the Maker Hip release key, from this repository's Secrets (never in the repository). No key: no build.
      # The old fixed debug key is no longer here.
      - name: The Maker Hip release key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_B64_2: ${{ secrets.RELEASE_KEYSTORE_B64_2 }}
          RELEASE_KEYSTORE_B64_3: ${{ secrets.RELEASE_KEYSTORE_B64_3 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then echo "The Maker Hip key is not in Secrets: stop"; exit 1; fi
          printf '%s%s%s' "$RELEASE_KEYSTORE_B64" "$RELEASE_KEYSTORE_B64_2" "$RELEASE_KEYSTORE_B64_3" | tr -d ' \t\r\n' | base64 -d > release.jks

      - name: Read the app version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          gradle assembleDebug --stacktrace
          # (signed with the Maker Hip key, or no APK)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs build/outputs/apk/debug/*.apk | tr 'A-F' 'a-f' | grep -q "sha-256 digest: f3d4074b5e5a731072b992434b0985f8c376dbf4b76fa75eb6445fbeafea4490" || \
            { echo "The APK is not signed with the Maker Hip key: stop"; exit 1; }

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 16track-v${{ steps.ver.outputs.name }}-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # every version its own release page (v0.1, v0.2, ...); a work branch's builds are pre-releases
      - name: Publish this version
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.name }}
        run: |
          PRE=""
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then PRE="--prerelease"; fi
          gh release delete "v$VER" --yes --cleanup-tag || true
          gh release create "v$VER" build/outputs/apk/debug/*.apk $PRE \
            --title "16 Track Mixer Recorder $VER" \
            --notes "16 Track Mixer Recorder $VER by Maker Hip. Download the .apk below and install it." \
            --target "${{ github.sha }}"
