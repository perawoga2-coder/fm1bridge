name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle
      run: |
        # สร้างโปรเจกต์ Gradle พื้นฐานจำเป็นสำหรับการคอมไพล์ไฟล์ Kotlin เดียว
        echo "include ':app'" > settings.gradle
        mkdir -p app/src/main/java/com/example/fm1bridge
        mkdir -p app/src/main/res
        
        # ย้ายไฟล์ MainActivity.kt ไปยังโครงสร้างที่ถูกต้อง (หากยังไม่ได้จัดโครงสร้างโฟลเดอร์)
        if [ -f "MainActivity.kt" ]; then
          mv MainActivity.kt app/src/main/java/com/example/fm1bridge/
        fi

        # สร้าง AndroidManifest.xml พื้นฐาน
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.fm1bridge">
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application
                android:label="FM1 Bridge"
                android:theme="@android:style/Theme.DeviceDefault.Light">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # สร้างไฟล์ build.gradle สำหรับคอมไพล์
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.fm1bridge'
            compileSdk 34
            defaultConfig {
                applicationId 'com.example.fm1bridge'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF

        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
