name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # The Maker Hip release key, from this repository's Secrets (never in the repository). The old fixed debug key
      # that was written out here (public) is gone.
      - name: The Maker Hip release key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_B64_2: ${{ secrets.RELEASE_KEYSTORE_B64_2 }}
          RELEASE_KEYSTORE_B64_3: ${{ secrets.RELEASE_KEYSTORE_B64_3 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then echo "The Maker Hip key is not in Secrets: stop"; exit 1; fi
          printf '%s%s%s' "$RELEASE_KEYSTORE_B64" "$RELEASE_KEYSTORE_B64_2" "$RELEASE_KEYSTORE_B64_3" | tr -d ' \t\r\n' | base64 -d > release.jks

      - name: Build debug APK
        env:
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fm1bridge-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to the Releases page
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/outputs/apk/debug/fm1bridge-debug.apk \
            --title "FM1 Bridge - latest build" \
            --notes "Debug APK built from the latest commit. Download the .apk file below and install it." \
            --target "${{ github.sha }}"
